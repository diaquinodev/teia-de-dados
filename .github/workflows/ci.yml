name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # O teste de tela (npm run test:tela) usa os caminhos do Chrome/Edge do Windows e roda
      # localmente; aqui ficam as regras e os erros plantados (mutantes), que só dependem da lógica.
      - run: npm run test:regras
      - run: npm run test:mutantes
