name: revisao

# Verde só com revisão de um agente diferente do autor (ou do CodeRabbit, ou autorrevisão
# declarada). Regra e formato do cabeçalho: scripts/revisao-check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  revisao-cruzada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: buscar descrição e revisões do PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > corpo.txt
          gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" \
            --jq '[.[] | {login: .user.login, body: (.body // ""), tipo: "review"}]' > revisoes.json

      - name: conferir revisão cruzada
        run: python3 scripts/revisao-check --corpo corpo.txt --revisoes revisoes.json
